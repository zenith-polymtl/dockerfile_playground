# docker-compose.yml
services:
  zenith:
    build: .
    # Host network & USB access for the LiDAR
    network_mode: host
    privileged: true
    ipc: host
    tty: true
    stdin_open: true
    devices:  
      - /dev/serial0:/dev/serial0
    # ⬇️  Bind-mount your workspaces so you can edit freely
    # If simulation on Mission Planner OR real flight test : change address to tcp://127.0.0.1:5763 OR udp:// (near line 24)
    volumes:
      - ./ros2_ws:/ros2_ws:rw
      - /tmp/.X11-unix:/tmp/.X11-unix 
      - ~/.Xauthority:/root/.Xauthority:ro
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        cd /ros2_ws &&
        colcon build&&
        ros2 daemon start &&
        source install/setup.bash &&
        ros2 launch mavros apm.launch fcu_url:=serial:///dev/ttyAMA10:115200   &&
        tail -f /dev/null
      "

    #No zenmav
    #serial:///dev/serial0:921600  
    #ros2 launch mavros apm.launch fcu_url:=tcp://127.0.0.1:5763 &&
    #ros2 launch mavros apm.launch fcu_url:=udp://:14550@ &&
    environment:
      - ROS_DOMAIN_ID=1
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - DISPLAY
      - XAUTHORITY=/root/.Xauthority
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

      