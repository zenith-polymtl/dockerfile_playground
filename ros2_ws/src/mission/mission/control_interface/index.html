<!DOCTYPE html>
<html>
<head>
    <title>Drone Control</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>Drone Control Interface</h1>
        </div>
        
        <div class="sidebar">
            <h2>System Control</h2>
            <div class="button-group">
                
                <button class="battery-btn" onclick="sendCommand('/battery_changed', 'CHANGED', 'String')">Battery Changed</button>
                
                <button class="abort-btn" onclick="sendCommand('/abort_brake', 'a.b.', 'String')">EMERGENCY ABORT</button>
                
                <button class="arm-btn" onclick="sendCommand('/confirm_arming', 'ARM', 'String')">ARM & AUTHORIZE TAKEOFF</button>
                
            </div>
        </div>

        <div class="content-area">
            
            <div class="control-section">
                <h2>Vision Control</h2>
                <div class="button-group">
                    
                    <button onclick="sendCommand('/go_vision', 'SOURCE', 'String')">Source Search</button>
                    
                    <button onclick="sendCommand('/go_vision', 'BUCKET', 'String')">Bucket Search</button>
                    
                </div>
                
                
                
            </div>
            
            <div class="control-section">
                <h2>Approach Mode</h2>
                <div class="button-group">
                    
                </div>
                
                    <div class="button-radio-group">
                    
                        <button type="button" 
                                class="button-radio" 
                                data-command="/approach_target_graph"
                                data-value="MANUAL"
                                data-topic-type="String"
                                onclick="selectRadioButton(this, 'Approach_Mode')">
                            Manual Mode
                        </button>
                    
                        <button type="button" 
                                class="button-radio" 
                                data-command="/approach_target_graph"
                                data-value="GO!"
                                data-topic-type="String"
                                onclick="selectRadioButton(this, 'Approach_Mode')">
                            Auto Mode
                        </button>
                    
                    </div>
                
                
                
            </div>
            
            <div class="control-section">
                <h2>Winch Control</h2>
                <div class="button-group">
                    
                    <button onclick="sendCommand('/go_winch', 'DOWN!', 'String')">Winch Down</button>
                    
                    <button onclick="sendCommand('/go_winch', 'UP', 'String')">Winch Up</button>
                    
                </div>
                
                
                
            </div>
            
            <div class="control-section">
                <h2>Water System</h2>
                <div class="button-group">
                    
                    <button onclick="sendCommand('/go_bucket_valve', 'REFILL', 'String')">Refill Water</button>
                    
                    <button onclick="sendCommand('/go_bucket_valve', 'RELEASE', 'String')">Release Water</button>
                    
                    <button onclick="sendCommand('/valve_state', 'OPEN', 'String')">Open Valve</button>
                    
                    <button onclick="sendCommand('/valve_state', 'CLOSE', 'String')">Close Valve</button>
                    
                </div>
                
                
                <div class="input-group">
                    
                    <label>Buckets:</label>
                    <input type="number" id="bucketNumber" min="1" value="1">
                    <button onclick="setAmount('bucketNumber', '/bucket_number', 'Int32')" style="min-width: 80px;">Set</button>
                    
                </div>
                
                
            </div>
            
            <div class="control-section">
                <h2>Sensor Data</h2>
                <div class="button-group">
                    
                </div>
                
                
                
                
                    <div class="sensor-display" id="waterQty">
                        <span>Water Quantity</span>
                        <span>0 mL</span>
                    </div>
                
                    <div class="sensor-display" id="torque">
                        <span>Motor Torque</span>
                        <span>0.00 Nm</span>
                    </div>
                
                
            </div>
            
        </div>
        <div class="terminal-area">
            <h2 class="terminal-header" onclick="toggleTerminal()">
                <span>System Terminal</span>
                <span class="toggle-icon">▼</span>
            </h2>
            <div class="terminal-content">
                <div id="terminal"></div>
            </div>
        </div>
    </div>

    <script src="static/index.js"></script>
</body>
</html>
