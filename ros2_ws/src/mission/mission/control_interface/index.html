<!DOCTYPE html>
<html>
<head>
    <title>Drone Control</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
       <div class="container">
        <h1>Drone Control Interface</h1>
        
        <div class="grid">
            <div class="control-section">
                <h2>
                    Vision Control
                </h2>
                <div class="button-group">
                    <button onclick="sendCommand('vision_source')">Source Search</button>
                    <button onclick="sendCommand('vision_bucket')">Bucket Search</button>
                </div>
            </div>

            <div class="control-section">
                <h2>
                    Approach Mode
                </h2>
                <div class="button-group">
                    <button onclick="sendCommand('manual_approach')">Manual Mode</button>
                    <button onclick="sendCommand('auto_approach')">Auto Mode</button>
                </div>
            </div>

            <div class="control-section">
                <h2>
                    Winch Control
                </h2>
                <div class="button-group">
                    <button onclick="sendCommand('winch_down')">Winch Down</button>
                    <button onclick="sendCommand('winch_up')">Winch Up</button>
                </div>
            </div>

            <div class="control-section">
                <h2>
                    Water System
                </h2>
                <div class="button-group">
                    <button onclick="sendCommand('water_refill')">Refill Water</button>
                    <button onclick="sendCommand('water_release')">Release Water</button>
                </div>
                <div class="input-group">
                    <label>Buckets:</label>
                    <input type="number" id="bucketNumber" min="1" value="1">
                    <button onclick="setBuckets()" style="min-width: 80px;">Set</button>
                </div>
                <div class="button-group">
                    <button onclick="sendCommand('valve_open')">Open Valve</button>
                    <button onclick="sendCommand('valve_close')">Close Valve</button>
                </div>
            </div>

            <div class="control-section">
                <h2>
                    Sensor Data
                </h2>
                <div class="sensor-display" id="waterQty">
                    <span>Water Quantity</span>
                    <span>0 mL</span>
                </div>
                <div class="sensor-display" id="torque">
                    <span>Motor Torque</span>
                    <span>0.00 Nm</span>
                </div>
            </div>

            <div class="control-section terminal-section">
                <h2>
                    System Terminal
                </h2>
                <div id="terminal">
                </div>
            </div>

            <div class="control-section system-controls">
                <h2>
                    System Control
                </h2>
                <div style="margin-bottom: 16px;">
                    <button onclick="sendCommand('battery_changed')">Battery Changed</button>
                </div>
                <div class="button-group">
                    <button class="abort-btn" onclick="confirmAbort()">EMERGENCY ABORT</button>
                    <button class="arm-btn" onclick="confirmArming()">ARM & AUTHORIZE TAKEOFF</button>
                </div>
            </div>
        </div>
    </div>


    <script src="static/index.js"></script>
</body>
</html>
