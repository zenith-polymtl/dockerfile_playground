<!DOCTYPE html>
<html>
<head>
    <title>Drone Control</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>Drone Control Interface</h1>
        </div>
        
        <div class="sidebar">
            <h2>System Control</h2>
            <div class="button-group">
                
                <button class="battery-btn" onclick="sendCommand('/battery_changed', 'CHANGED')">Battery Changed</button>
                
                <button class="abort-btn" onclick="sendCommand('/abort_brake', 'a.b.')">EMERGENCY ABORT</button>
                
                <button class="arm-btn" onclick="sendCommand('/confirm_arming', 'ARM')">ARM & AUTHORIZE TAKEOFF</button>
                
            </div>
        </div>

        <div class="content-area">
            
            <div class="control-section">
                <h2>Vision Control</h2>
                <div class="button-group">
                    
                    <button onclick="sendCommand('/go_vision', 'SOURCE')">Source Search</button>
                    
                    <button onclick="sendCommand('/go_vision', 'BUCKET')">Bucket Search</button>
                    
                </div>
                
                
                
            </div>
            
            <div class="control-section">
                <h2>Approach Mode</h2>
                <div class="button-group">
                    
                </div>
                
                    <div class="button-radio-group">
                    
                        <button type="button" 
                                class="button-radio" 
                                data-command="/approach_target_graph" 
                                onclick="selectRadioButton(this, 'Approach_Mode')">
                            Manual Mode
                        </button>
                    
                        <button type="button" 
                                class="button-radio" 
                                data-command="/approach_target_graph" 
                                onclick="selectRadioButton(this, 'Approach_Mode')">
                            Auto Mode
                        </button>
                    
                    </div>
                
                
                
            </div>
            
            <div class="control-section">
                <h2>Winch Control</h2>
                <div class="button-group">
                    
                    <button onclick="sendCommand('/go_winch', 'DOWN!')">Winch Down</button>
                    
                    <button onclick="sendCommand('/go_winch', 'UP')">Winch Up</button>
                    
                </div>
                
                
                
            </div>
            
            <div class="control-section">
                <h2>Water System</h2>
                <div class="button-group">
                    
                    <button onclick="sendCommand('/go_bucket_valve', 'REFILL')">Refill Water</button>
                    
                    <button onclick="sendCommand('/go_bucket_valve', 'RELEASE')">Release Water</button>
                    
                    <button onclick="sendCommand('/valve_state', 'OPEN')">Open Valve</button>
                    
                    <button onclick="sendCommand('/valve_state', 'CLOSE')">Close Valve</button>
                    
                </div>
                
                
                <div class="input-group">
                    
                    <label>Buckets:</label>
                    <input type="number" id="bucketNumber" min="1" value="1">
                    <button onclick="setAmount('bucketNumber', '/bucket_number', '')" style="min-width: 80px;">Set</button>
                    
                </div>
                
                
            </div>
            
            <div class="control-section">
                <h2>Sensor Data</h2>
                <div class="button-group">
                    
                </div>
                
                
                
                
                    <div class="sensor-display" id="waterQty">
                        <span>Water Quantity</span>
                        <span>0 mL</span>
                    </div>
                
                    <div class="sensor-display" id="torque">
                        <span>Motor Torque</span>
                        <span>0.00 Nm</span>
                    </div>
                
                
            </div>
            
        </div>

        <div class="terminal-area">
            <h2>System Terminal</h2>
            <div id="terminal"></div>
        </div>
    </div>

    <script src="static/index.js"></script>
</body>
</html>
